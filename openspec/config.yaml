schema: spec-driven

context: |
  Product: Pijoo, a personal context assistant with one private owner task and one isolated managed task per shared contact.
  Current phase: editable persona, authenticated per-contact memory, and ordinary-text auto replies inside one-use two-member channels.
  Product authority: PRODUCT.md.
  Development status authority: docs/STATUS.md.
  Roadmap authority: docs/ROADMAP.md.
  Architecture authority: ARCHITECTURE.md.
  Core boundary: Codex history, persona, contact memory and task bindings stay local; the same Channel, Account Session, Membership and relay serve macOS and Web; risky actions still require separate approval.

rules:
  proposal:
    - State which user-facing channel concepts are removed or hidden.
    - List explicit non-goals and the minimum reusable transport foundation.
  design:
    - Explain local history authorization, source attribution, revocation and relay trust boundaries.
    - Keep history reading, outbound sending and tool execution as separate grants.
    - Treat AGENTS.md as identity context, not as a sandbox or authorization boundary.
    - Reuse the existing Hono service and Channel APIs before adding any Web-specific service or protocol.
  specs:
    - Every authorization requirement must include denied and revoked scenarios.
    - Every outbound requirement must distinguish ordinary auto replies from risky actions that require approval.
  tasks:
    - Deliver the smallest real Codex history slice before changing the full macOS UI.
    - Keep invite tokens out of server-rendered URLs and browser persistent storage.
