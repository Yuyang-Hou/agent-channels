name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate server and OpenSpec
        run: |
          npm ci --prefix server
          npm run typecheck --prefix server
          npm test --prefix server -- --no-file-parallelism
          npm run build --prefix server
          npx --yes @fission-ai/openspec@1.6.0 validate --strict --all
          git diff --check
      - name: Build candidate package
        id: package
        run: |
          ./macos/next-beta-version.sh --self-test
          version="$(./macos/next-beta-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          PIJOO_RELEASE_VERSION="$version" PIJOO_SIGN_IDENTITY=- ./macos/build-app.sh
          ./macos/verify-package.sh "$version"
      - name: Upload merged candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pijoo-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: macos/build/Pijoo-${{ steps.package.outputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 7
